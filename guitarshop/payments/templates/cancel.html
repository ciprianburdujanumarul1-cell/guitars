<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Cancelled — GuitarShop</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { background: #0a0a0a; color: #f0ece3; font-family: 'Barlow Condensed', sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
nav { position: sticky; top: 0; background: rgba(10,10,10,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; }
.nav-brand { font-family: 'Bebas Neue', sans-serif; font-size: 24px; }
.nav-brand span { color: #e85d04; }
.page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.card { background: #111; border: 1px solid #222; border-radius: 10px; max-width: 540px; width: 100%; padding: 50px 40px; text-align: center; }
.x-circle { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #444; display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; }
.x-circle svg { width: 28px; height: 28px; }
.title { font-family: 'Bebas Neue', sans-serif; font-size: 44px; margin: 0 0 8px; }
.title span { color: #e85d04; }
.subtitle { color: #888; font-size: 17px; margin: 0 0 32px; line-height: 1.5; }
.divider { border: none; border-top: 1px solid #222; margin: 28px 0; }
.info-box { background: #0a0a0a; border: 1px solid #222; border-left: 3px solid #333; border-radius: 0 6px 6px 0; padding: 16px 18px; text-align: left; }
.info-box p { margin: 0; color: #555; font-size: 15px; line-height: 1.6; }
.info-box p + p { margin-top: 8px; }
.actions { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 140px; padding: 12px 20px; cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.5px; text-align: center; text-decoration: none; transition: 0.2s; }
.btn-primary { background: none; border: 1px solid #e85d04; color: #e85d04; }
.btn-primary:hover { background: #e85d04; color: #0a0a0a; }
.btn-secondary { background: none; border: 1px solid #333; color: #888; }
.btn-secondary:hover { border-color: #555; color: #f0ece3; }
</style>
</head>
<body>
<nav>
  <div class="nav-brand">🎸 Guitar<span>Shop</span></div>
</nav>

<div class="page">
  <div class="card">

    <div class="x-circle">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="6" y1="6" x2="22" y2="22" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="22" y1="6" x2="6" y2="22" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="title">Payment <span>Cancelled</span></div>
    <p class="subtitle">No worries — your order wasn't placed and you haven't been charged.</p>

    <hr class="divider">

    <div class="info-box">
      <p>The guitar is still waiting for you. Head back to the product page whenever you're ready.</p>
      <p>If something went wrong during checkout, feel free to contact our support team.</p>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-secondary">Back to Shop</a>
      <a href="{% url 'product_detail' product_id %}" class="btn btn-primary">Try Again</a>
    </div>

  </div>
</div>
</body>
</html>
